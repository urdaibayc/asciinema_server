grafana.ini

# Grafana Configuration for asciinema Server Monitoring
# See https://grafana.net/docs/grafana/latest/installation/configuration/

[server]
host = "0.0.0.0"
port = 3000
# root_url = "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
serve_from_sub_path = true

[database]
type = "postgres"
host = "postgres:5432"
name = "grafana"
user = "postgres"
ssl_mode = "disable"

[session]
sookie_secure = true
cookie_httponly = true
session_life_time = 24h

[security]
admin_user = "admin"
admin_password = "${GRAFANA_PASSWORD}"
viewers_can_edit = false
skip_runtime_checks = true

[users]
allow_sign_up = false
allow_org_users = true

[auth.anonymous]
enabled = false

[log]
level = "info"
mode = "console"

[metrics]
enabled = true

[metrics.prometheus]
enabled = true

[metrics.graphite]
enabled = false

[notifications]
enable = true

[notifications.mail]
enabled = true

[datasources]
[[datasources]]
name = "Prometheus"
type = "prometheus"
url = "http://prometheus:9090"
access = "proxy"
is_default = true

[[datasources]]
name = "PostgreSQL"
type = "postgres"
url = "postgres:5432"
database = "grafana"
user = "postgres"

[grafana]
dashboard_max_memory = 1024

grafana_json = {}

[plugins]
allow_loading_unsigned_plugins = []

[storage]
local.path = "/var/lib/grafana"

[security]
content_security_policy = "default-src 'self'"

[analytics]
check_for_updates = true

[support]
feedback_links = []

[auth]
disable_login_form = false
disable_password_fields = false
